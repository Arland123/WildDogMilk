<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(125% 85% at 50% 0%, #fffdf8 0%, #fff4e2 45%, #ffe0b0 100%);
    color: #4a3218;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 8px 0 calc(6px + env(safe-area-inset-bottom));
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  /* 顶部信息栏：与棋盘同宽的卡片，三行左对齐 + 右侧预览/按钮 */
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 9px 12px; margin-bottom: 8px;
    background: rgba(255,255,255,.62); border: 1px solid rgba(180,120,50,.16);
    border-radius: 14px; box-shadow: 0 2px 10px rgba(140,90,30,.07);
  }
  .hud-left { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .title { font-size: 12px; font-weight: 700; letter-spacing: 2px; color: #b45309; }
  .scoreline { display: flex; align-items: baseline; gap: 4px; }
  .score { font-size: 34px; font-weight: 900; line-height: 1.05; color: #3f2a12; font-variant-numeric: tabular-nums; letter-spacing: -.5px; }
  .unit { font-size: 11px; font-weight: 700; color: rgba(120,80,30,.55); }
  .best { display: flex; align-items: center; gap: 5px; font-size: 11px; color: rgba(90,61,30,.62); }
  .best b { font-weight: 700; color: rgba(90,61,30,.82); font-variant-numeric: tabular-nums; }
  .hud-right { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  .next {
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    width: 54px; flex: 0 0 auto; padding: 5px 0 4px;
    background: #fffdf7; border: 1px solid rgba(180,120,50,.2); border-radius: 11px;
  }
  .next-label { font-size: 9px; letter-spacing: .5px; color: rgba(120,80,30,.62); white-space: nowrap; }
  .next canvas { width: 40px; height: 52px; }
  .btns { display: flex; flex-direction: column; gap: 6px; }
  .icon-btn {
    width: 32px; height: 32px; display: grid; place-items: center;
    border: 1px solid rgba(180,120,50,.18); border-radius: 50%; cursor: pointer;
    background: #fffdf7; color: #7a5327; box-shadow: 0 1px 2px rgba(140,90,30,.1);
  }
  .icon-btn svg { width: 17px; height: 17px; }
  .icon-btn .ico-off { display: none; }
  .icon-btn.muted .ico-on { display: none; }
  .icon-btn.muted .ico-off { display: block; }
  .icon-btn:active { transform: translateY(1px); }
  .icon-btn:focus-visible, .btn:focus-visible, .mode-chip:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
  #board {
    position: relative; border-radius: 18px; overflow: hidden;
    border: 1px solid rgba(150,100,40,.16);
    box-shadow: inset 0 1px 0 #fff, 0 10px 26px rgba(130,80,25,.16);
    background: #fffdf7;
  }
  #game { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; }
  #chain {
    display: block; margin-top: 8px; border-radius: 12px;
    background: rgba(255,255,255,.5); box-shadow: inset 0 0 0 1px rgba(180,120,50,.14);
  }
  .overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #0006; backdrop-filter: blur(2px);
  }
  .overlay[hidden] { display: none; }
  .dialog { background: #fff8ec; border-radius: 18px; padding: 22px 26px; text-align: center; min-width: 230px; box-shadow: 0 8px 30px #0004; }
  .dialog .emoji { font-size: 46px; }
  .dialog h2 { margin: 6px 0 10px; font-size: 22px; }
  .dialog p { margin: 4px 0; }
  .dialog strong { font-size: 26px; color: #c2410c; }
  .btn {
    margin-top: 14px; border: 0; border-radius: 12px; padding: 10px 26px; cursor: pointer;
    font: inherit; font-size: 17px; font-weight: 700; color: #fff; background: #e8553a; box-shadow: 0 3px 0 #a8321d;
  }
  .dialog .row { display: flex; gap: 8px; justify-content: center; margin-top: 14px; }
  .dialog .row .btn { margin-top: 0; }
  .btn.ghost { background: #fff; color: #8a5a2b; box-shadow: 0 3px 0 #e5b679; }
  .dialog .hint { font-size: 12px; opacity: .7; }
  /* 小标签：难度 / 提示共用，统一成胶囊 */
  .mode-chip {
    padding: 1px 8px; border: 1px solid rgba(180,120,50,.22); border-radius: 999px; cursor: pointer;
    font: inherit; font-size: 10px; font-weight: 700; line-height: 15px; color: #8a5a2b;
    background: #fff;
  }
  .mode-chip[hidden] { display: none; }
  .mode-chip:active { transform: translateY(1px); }
</style>

      </button>
      <button class="icon-btn" id="resetBtn" type="button" aria-label="重新开始">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.2 10a6.2 6.2 0 1 1-1.9-4.4"/><path d="M16.4 3.6v3.2h-3.2"/></svg>
      </button>

</header>

<div id="board">
  <canvas id="game" aria-label="游戏区域：移动瞄准，点击或松手投放"></canvas>
  <div class="overlay" id="over" hidden>
    <div class="dialog" role="dialog" aria-labelledby="overTitle">
      <div class="emoji">🐕</div>

        <button class="btn" id="modeOk" type="button">切换</button>
      </div>
    </div>
  </div>
</div>

<canvas id="chain" aria-label="合成顺序：从野生马尿到野生狗奶"></canvas>

<!-- Matter.js 0.20.0（MIT），本地引入，负责奶盒的刚体碰撞和翻倒 -->
<script src="lib/matter.min.js"></script>
<script>
'use strict';

// ===== 十一级奶盒 =====
// s：面积开方（决定体积），相邻两级线性尺寸约差 12%~24%，保证每一级都能一眼看出大小
// aspect：贴图宽高比（img/N.png 的实际裁切比例），宽 = s·√aspect，高 = s/√aspect
const LEVELS = [
  { name: '野生马尿',         color: '#f2c230', s: 42,  aspect: .468 },
  { name: '野生狗尿',         color: '#5fa83c', s: 51,  aspect: .436 },
  { name: '野生鼠奶',         color: '#4a4f58', s: 62,  aspect: .433 },
  { name: '野生驴奶',         color: '#2e7fc9', s: 75,  aspect: .436 },
  { name: '老母鸡奶',         color: '#8a5a2b', s: 90,  aspect: .451 },
  { name: '野生见手青奶',     color: '#2f6a3d', s: 104, aspect: .440 },
  { name: '野老猫猴奶',       color: '#2b2b33', s: 120, aspect: .427 },
  { name: '野生爱因斯坦奶',   color: '#5b3a91', s: 136, aspect: .423 },
  { name: '幻纹虎奶',         color: '#d9531e', s: 154, aspect: .431 },
  { name: '野生龙奶',         color: '#e07a1f', s: 171, aspect: .435 },
  { name: '野生奶·终极进化版', color: '#1f4fa8', s: 211, aspect: .736 },
];
LEVELS.forEach((L) => {
  L.w = L.s * Math.sqrt(L.aspect);
  L.h = L.s / Math.sqrt(L.aspect);
  L.round = Math.max(3, L.w * .1);
});
const LAST = LEVELS.length - 1;
const SPAWN_WEIGHTS = [30, 28, 22, 13, 7];             // 只投放前 5 级，越小越常见
const MERGE_SCORE = LEVELS.map((_, i) => i * (i + 1)); // 合成出第 i 级得分
const FINAL_BONUS = 1000;                              // 两盒终极狗奶相撞：一起炸掉

// ===== 世界参数（逻辑坐标） =====
// 只有棋盘高度随难度变化，警戒线固定 150：
//   困难 720 → 有效堆叠 570（原版手感）
//   简单 750 → 有效堆叠 600
// 警戒线要高过最大的可投放奶盒（第 5 级，高 134），不然手上那盒会被画到棋盘外
const MODES = { hard: { name: '困难', h: 720 }, easy: { name: '简单', h: 750 } };
// 存档按路径隔离：/test/ 和正式版同域共用 localStorage，不隔离的话
// 在测试链接里选的难度、刷的分数都会串到正式版，看起来就像"困难模式却是简单布局"
const SCOPE = /\/test\//.test(location.pathname) ? 'test_' : '';
const MODE_KEY = SCOPE + 'wildDogMilkMode';

// 一次性修正：加路径隔离之前，测试页和正式版共用一个 key，难度可能被测试带偏。
// 这里只重置一次（用独立标记），之后照常记忆用户自己的选择。
(function resetStaleMode() {
  if (SCOPE) return;
  if (localStorage.getItem('wildDogMilkModeReset') === '1') return;
  localStorage.removeItem('wildDogMilkMode');
  localStorage.setItem('wildDogMilkModeReset', '1');
})();

let mode = localStorage.getItem(MODE_KEY) === 'easy' ? 'easy' : 'hard';

// 只在测试页生效的预览开关：/test/?egg=1 直接解锁提示彩蛋，方便手机上预览
// （正式版没有 SCOPE，所以线上玩家无法用这个参数跳过彩蛋）
if (SCOPE && /[?&]egg=1/.test(location.search)) {
  localStorage.setItem(SCOPE + 'wildDogMilkHint', '1');
}
const W = 400;
let H = MODES[mode].h;
const DEAD_Y = 150;
const STEP = 1000 / 60;
const PI2 = Math.PI * 2;
const TEXT_FONT = '"PingFang SC","Microsoft YaHei",sans-serif';

const { Engine, Bodies, Body, Composite, Events } = Matter;
const $ = (id) => document.getElementById(id);
const cvs = $('game'), ctx = cvs.getContext('2d');
const nextCvs = $('next'), nctx = nextCvs.getContext('2d');
const chainCvs = $('chain'), cctx = chainCvs.getContext('2d');
const board = $('board'), top_ = $('top');

const engine = Engine.create({ positionIterations: 10, velocityIterations: 8 });
engine.gravity.y = 1.6;
const world = engine.world;

let viewScale = 1, dpr = 1;
let particles = [], popups = [], mergeQueue = [];
let rings = [], boom = null, flash = 0, slow = 0;  // 狗奶大爆炸特效状态
// 最高分按难度分别记录：简单模式更容易出高分，混在一起会污染困难模式的记录
function bestKey() { return SCOPE + 'wildDogMilkBest_' + mode; }
function loadBest() { return +localStorage.getItem(bestKey()) || 0; }

// 老版本只有一条最高分，且那时候只有困难模式（H=720），升级时迁移一次就删掉旧 key
// 只在正式版做迁移，测试页不碰（测试页的分数不该进正式记录）
(function migrateLegacyBest() {
  if (SCOPE) return;
  const legacy = +localStorage.getItem('wildDogMilkBest') || 0;
  if (legacy > 0 && localStorage.getItem('wildDogMilkBest_hard') === null) {
    localStorage.setItem('wildDogMilkBest_hard', legacy);
  }
  localStorage.removeItem('wildDogMilkBest');
})();

let score = 0, best = loadBest();
let mergeCount = 0;   // 供提示模式做两步收益比较（hint.js 读取）
let curLv = 0, nextLv = 0, aimX = W / 2, dropCd = 0;
let dangerT = 0, maxLv = 0, shake = 0, over = false, acc = 0, lastT = 0, time = 0;
let soundOn = localStorage.getItem('wildDogMilkSound') !== '0';

// 墙体放在可视区外，足够厚防止穿透；换难度时连同高度一起重建
const WALL = 200;
function buildWalls() {
  return [
    Bodies.rectangle(W / 2, H + WALL / 2, W + WALL * 2, WALL, { isStatic: true, friction: .6 }),
    Bodies.rectangle(-WALL / 2, H / 2 - 400, WALL, H + 800, { isStatic: true, friction: .1 }),
    Bodies.rectangle(W + WALL / 2, H / 2 - 400, WALL, H + 800, { isStatic: true, friction: .1 }),
  ];
}
let walls = buildWalls();

// ===== 贴图 =====
LEVELS.forEach((L) => {
  const img = new Image();
  img.onload = () => { L.img = img; drawNext(); drawChain(); };
  img.src = `img/${LEVELS.indexOf(L) + 1}.png`;
});

function roundRect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

// 在 (x,y) 以角度 angle 画一盒第 i 级奶，k 为缩放
function drawCarton(g, i, x, y, k = 1, angle = 0, alpha = 1) {
  const L = LEVELS[i], w = L.w * k, h = L.h * k, r = L.round * k;
  g.save();
  g.globalAlpha = alpha;
  g.translate(x, y); g.rotate(angle);
  // 阴影
  g.fillStyle = 'rgba(80,45,10,.22)';
  roundRect(g, -w / 2 + 1.5 * k, -h / 2 + 2.5 * k, w, h, r); g.fill();
  if (L.img) {
    g.save();
    roundRect(g, -w / 2, -h / 2, w, h, r); g.clip();
    g.drawImage(L.img, -w / 2, -h / 2, w, h);
    g.restore();
  } else {
    // 图片缺失时的兜底：纯色盒子 + 名字
    g.fillStyle = L.color;
    roundRect(g, -w / 2, -h / 2, w, h, r); g.fill();
    g.fillStyle = '#fff';
    g.font = `900 ${Math.min(w * .22, h / L.name.length)}px ${TEXT_FONT}`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    [...L.name].forEach((ch, n, arr) => g.fillText(ch, 0, (n - (arr.length - 1) / 2) * h / (arr.length + 1)));
  }
  roundRect(g, -w / 2, -h / 2, w, h, r);
  g.lineWidth = Math.max(1, w * .025);
  g.strokeStyle = 'rgba(60,35,10,.45)'; g.stroke();
  if (i === LAST) {
    g.lineWidth = w * .03; g.strokeStyle = '#ffd34d';
    roundRect(g, -w / 2 - g.lineWidth / 2, -h / 2 - g.lineWidth / 2, w + g.lineWidth, h + g.lineWidth, r); g.stroke();
  }
  g.restore();
}

// ===== 音效 =====
let actx = null;
function tone(freq, dur = .12, type = 'sine', vol = .2, delay = 0) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + delay;
    const o = actx.createOscillator(), gn = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(freq * .55, t + dur);
    gn.gain.setValueAtTime(vol, t);
    gn.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(gn).connect(actx.destination);
    o.start(t); o.stop(t + dur + .02);
  } catch (_) { /* 音频不可用时静默 */ }
}

// ===== 游戏逻辑 =====
function randLv() {
  const cap = Math.min(SPAWN_WEIGHTS.length, Math.max(3, maxLv));
  let total = 0;
  for (let i = 0; i < cap; i++) total += SPAWN_WEIGHTS[i];
  let r = Math.random() * total;
  for (let i = 0; i < cap; i++) { r -= SPAWN_WEIGHTS[i]; if (r < 0) return i; }
  return 0;
}

function cartons() { return Composite.allBodies(world).filter((b) => b.lv !== undefined); }

function spawnY(lv) { return DEAD_Y - 6 - LEVELS[lv].h / 2; }

function makeCarton(lv, x, y, angle = 0, k = 1) {
  const L = LEVELS[lv];
  const b = Bodies.rectangle(x, y, L.w * k, L.h * k, {
    angle, chamfer: { radius: L.round * k },
    friction: .25, frictionStatic: .5, frictionAir: .004, restitution: .12, density: .0012,
  });
  b.lv = lv; b.k = k; b.born = time; b.gone = false;
  Composite.add(world, b);
  return b;
}

function reset() {
  Composite.clear(world, false);
  Composite.add(world, walls);
  particles = []; popups = []; mergeQueue = [];
  rings = []; boom = null; flash = 0; slow = 0;
  score = 0; maxLv = 0; dangerT = 0; dropCd = 0; shake = 0; over = false;
  mergeCount = 0;
  curLv = randLv(); nextLv = randLv();
  aimX = W / 2;
  $('over').hidden = true;
  $('modeAsk').hidden = true;
  if (window.__hintInvalidate) window.__hintInvalidate();
  updateHud(); drawNext(); drawChain();
}

function clampAim(lv) {
  const half = LEVELS[lv].w / 2 + 1;
  return Math.min(W - half, Math.max(half, aimX));
}

function drop() {
  if (over || dropCd > 0) return;
  const b = makeCarton(curLv, clampAim(curLv), spawnY(curLv));
  Body.setVelocity(b, { x: 0, y: 2 });
  tone(320, .08, 'triangle', .12);
  curLv = nextLv; nextLv = randLv();
  dropCd = .5;
  if (window.__hintInvalidate) window.__hintInvalidate();
  drawNext();
}

function addScore(n, x, y) {
  score += n;
  popups.push({ x, y, text: '+' + n, life: 1 });
  if (score > best) { best = score; localStorage.setItem(bestKey(), best); }
  updateHud();
}

function burst(x, y, color, n, speed) {
  for (let k = 0; k < n; k++) {
    const a = Math.random() * PI2, v = speed * (.4 + Math.random() * .6);
    particles.push({
      x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - speed * .3,
      r: 2 + Math.random() * 3.5, life: 1, decay: 1.2 + Math.random(),
      color: Math.random() < .6 ? '#fffdf5' : color,
    });
  }
}

// 狗奶大爆炸：冲击波 + 闪光 + 光芒 + 火花/彩纸 + 慢动作 + 把场上奶盒炸飞
let burstSheet = null, glowSheet = null;
function makeBurstSheet() {
  // 只画 16 道光芒（会按对角线放大 3.2 倍，所以中心辉光必须单独一张，否则会被一起放大成一片白）
  if (burstSheet) return burstSheet;
  const S = 512, c = document.createElement('canvas');
  c.width = S; c.height = S;
  const g = c.getContext('2d');
  g.translate(S / 2, S / 2);
  g.globalCompositeOperation = 'lighter';
  const R = S / 2;
  for (let i = 0; i < 16; i++) {
    g.rotate(PI2 / 16);
    const lg = g.createLinearGradient(0, 0, R, 0);
    lg.addColorStop(0, 'rgba(255,214,90,.32)');
    lg.addColorStop(1, 'rgba(255,214,90,0)');
    g.fillStyle = lg;
    g.beginPath(); g.moveTo(0, 0); g.lineTo(R, -R * .05); g.lineTo(R, R * .05); g.closePath(); g.fill();
  }
  burstSheet = c;
  return c;
}

function makeGlowSheet() {
  // 中心辉光：256×256 的圆形渐变，固定按 520 世界单位贴回（半径约 260，和原来一致）
  if (glowSheet) return glowSheet;
  const S = 256, c = document.createElement('canvas');
  c.width = S; c.height = S;
  const g = c.getContext('2d');
  const rg = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  rg.addColorStop(0, 'rgba(255,250,220,.72)');
  rg.addColorStop(.45, 'rgba(255,225,140,.32)');
  rg.addColorStop(1, 'rgba(255,200,80,0)');
  g.fillStyle = rg; g.fillRect(0, 0, S, S);
  glowSheet = c;
  return c;
}

let titleSheet = null;
function makeTitleSheet() {
  // 360×140 的离屏贴图，按世界坐标 1:1 贴回（文字 46px 与原设计一致）
  if (titleSheet) return titleSheet;
  const W2 = 360, H2 = 140, txt = '狗奶大爆炸';
  const c = document.createElement('canvas');
  c.width = W2; c.height = H2;
  const g = c.getContext('2d');
  g.font = `900 46px ${TEXT_FONT}`;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineJoin = 'round';
  g.lineWidth = 20; g.strokeStyle = 'rgba(255,170,30,.30)'; g.strokeText(txt, W2 / 2, H2 / 2);  // 外发光用粗描边代替 shadowBlur
  g.lineWidth = 11; g.strokeStyle = '#7a2a05'; g.strokeText(txt, W2 / 2, H2 / 2);
  g.lineWidth = 5; g.strokeStyle = '#fff'; g.strokeText(txt, W2 / 2, H2 / 2);
  const lg = g.createLinearGradient(0, H2 / 2 - 30, 0, H2 / 2 + 30);
  lg.addColorStop(0, '#fff7b0'); lg.addColorStop(.5, '#ffc72c'); lg.addColorStop(1, '#ff7a1a');
  g.fillStyle = lg; g.fillText(txt, W2 / 2, H2 / 2);
  titleSheet = c;
  return c;
}

function megaBoom(x, y) {
  boom = { x, y, t: 0 };
  flash = .55; slow = .9; shake = 34;
  for (let i = 0; i < 4; i++) rings.push({ x, y, r: 10, v: 620 + i * 90, w: 22 - i * 3, life: 1, delay: i * .09 });
  burst(x, y, '#ffd34d', 40, 640);
  const cols = ['#ffd34d', '#ff6b4a', '#4ad0ff', '#7cff6b', '#ff7ad9', '#fffdf5'];
  for (let k = 0; k < 100; k++) {            // 发光火花（加色混合，带拖尾）
    const a = Math.random() * PI2, v = 250 + Math.random() * 900;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 200, r: 1.5 + Math.random() * 2.5,
      life: 1, decay: .5 + Math.random() * .7, color: Math.random() < .5 ? '#ffe9a0' : '#ffb347', spark: true, g: 500 });
  }
  for (let k = 0; k < 90; k++) {             // 彩纸
    const a = -Math.PI / 2 + (Math.random() - .5) * 2.6, v = 300 + Math.random() * 800;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: 4 + Math.random() * 5,
      life: 1, decay: .45 + Math.random() * .3, color: cols[k % cols.length], conf: true,
      rot: Math.random() * PI2, vr: (Math.random() - .5) * 18, g: 700, drag: 1.4 });
  }
  for (const b of cartons()) {               // 冲击波把其它奶盒掀开
    if (b.gone) continue;
    const dx = b.position.x - x, dy = b.position.y - y, d = Math.hypot(dx, dy) || 1;
    const f = Math.min(1, 260 / d) * 0.045 * b.mass;
    Body.applyForce(b, b.position, { x: dx / d * f, y: dy / d * f - 0.018 * b.mass });
  }
  popups.push({ x: W / 2, y: H * .36, text: '狗奶大爆炸', life: 2.8, mega: true });
  popups.push({ x: W / 2, y: H * .36 + 64, text: '🐕 终极进化 · +' + FINAL_BONUS, life: 2.4, sub: true });
  if (navigator.vibrate) navigator.vibrate([60, 30, 120, 30, 200]);
  boomSound();
}

function boomSound() {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime, len = Math.floor(actx.sampleRate * 1.2);
    const buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5);
    const src = actx.createBufferSource(), lp = actx.createBiquadFilter(), gn = actx.createGain();
    src.buffer = buf; lp.type = 'lowpass';
    lp.frequency.setValueAtTime(3000, t); lp.frequency.exponentialRampToValueAtTime(120, t + 1.1);
    gn.gain.setValueAtTime(.7, t); gn.gain.exponentialRampToValueAtTime(.001, t + 1.2);
    src.connect(lp).connect(gn).connect(actx.destination); src.start(t);
  } catch (e) { /* 音频不可用就静默 */ }
  tone(160, .9, 'sawtooth', .3);
  tone(90, 1, 'sine', .4);
  [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .5, 'triangle', .18, .25 + i * .09));
}

// 同级相碰：先记进队列，物理步结束后统一处理（避免在碰撞回调里改世界）
function onCollide(e) {
  if (over) return;
  for (const { bodyA: a, bodyB: b } of e.pairs) {
    if (a.lv === undefined || a.lv !== b.lv || a.gone || b.gone) continue;
    a.gone = b.gone = true;
    mergeQueue.push([a, b]);
  }
}
Events.on(engine, 'collisionStart', onCollide);
Events.on(engine, 'collisionActive', onCollide);

function merge(a, b) {
  Composite.remove(world, [a, b]);
  const x = (a.position.x + b.position.x) / 2, y = (a.position.y + b.position.y) / 2;
  mergeCount++;
  if (a.lv === LAST) {
    addScore(FINAL_BONUS, x, y);
    megaBoom(x, y);
    return;
  }
  const lv = a.lv + 1, L = LEVELS[lv];
  // 新盒子从 0.5 倍长到原尺寸，避免一出生就把周围的盒子炸飞
  const nb = makeCarton(lv, x, y, (a.angle + b.angle) / 2, .5);
  Body.setVelocity(nb, { x: (a.velocity.x + b.velocity.x) / 2, y: Math.min(0, (a.velocity.y + b.velocity.y) / 2) - 1 });
  burst(x, y, L.color, 8 + lv * 2, 160 + lv * 25);
  addScore(MERGE_SCORE[lv], x, y - L.h / 2);
  if (lv > maxLv) {
    maxLv = lv; drawChain();
    if (lv >= 5) popups.push({ x: W / 2, y: H * .38, text: L.name, life: 1.6, big: true });
  }
  if (lv === LAST) { shake = 10; tone(520, .5, 'triangle', .2); tone(780, .5, 'triangle', .15, .15); }
  else { shake = Math.max(shake, lv * .5); tone(780 - lv * 50, .14, 'sine', .22); }
  // 彩蛋：玩家自己合成出最高级，解锁提示模式（hint.js 负责记忆与 UI）
  if (lv === LAST && window.__hintUnlock) window.__hintUnlock();
}

function update(dt) {
  time += dt;
  if (dropCd > 0) dropCd -= dt;

  if (!over) {
    Engine.update(engine, STEP);
    const q = mergeQueue; mergeQueue = [];
    q.forEach(([a, b]) => merge(a, b));
    for (const b of cartons()) {
      if (b.k < 1) {
        const k = Math.min(1, b.k + dt / .18);
        Body.scale(b, k / b.k, k / b.k);
        b.k = k;
      }
    }
  }

  for (const p of particles) {
    if (p.drag) { const k = Math.exp(-p.drag * dt); p.vx *= k; p.vy *= k; }
    p.vy += (p.g || 900) * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= p.decay * dt;
    if (p.vr) p.rot += p.vr * dt;
    if (p.spark) { (p.tr = p.tr || []).push(p.x, p.y); if (p.tr.length > 12) p.tr.splice(0, 2); }
  }
  if (boom) { boom.t += dt; if (boom.t > 2.6) boom = null; }
  for (const r of rings) { if (r.delay > 0) { r.delay -= dt; continue; } r.r += r.v * dt; r.v *= Math.exp(-1.6 * dt); r.life -= dt * .9; }
  rings = rings.filter((r) => r.life > 0);
  flash = Math.max(0, flash - dt * 3.2);
  slow = Math.max(0, slow - dt);
  particles = particles.filter((p) => p.life > 0);
  for (const p of popups) { p.y -= 40 * dt; p.life -= dt; }
  popups = popups.filter((p) => p.life > 0);
  shake = Math.max(0, shake - (boom ? 22 : 40) * dt);

  if (over) return;
  // 越线判定：已落定的奶盒顶在警戒线上方持续 2 秒
  const danger = cartons().some((b) => time - b.born > 1.2 && b.bounds.min.y < DEAD_Y && b.speed < 1.5);
  dangerT = danger ? dangerT + dt : Math.max(0, dangerT - dt * 2);
  if (dangerT > 2) gameOver();
}

function gameOver() {
  over = true;
  tone(300, .6, 'sawtooth', .15); tone(180, .7, 'sawtooth', .12, .2);
  $('finalScore').textContent = score;
  $('finalBest').textContent = best;
  $('finalLevel').textContent = `Lv.${maxLv + 1} ${LEVELS[maxLv].name}`;
  setTimeout(() => { $('over').hidden = false; $('restartBtn').focus(); }, 500);
}

// ===== 绘制 =====
function render() {
  ctx.setTransform(viewScale * dpr, 0, 0, viewScale * dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);

  // 背景：超市冷柜货架
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#fffdf7'); bg.addColorStop(.55, '#fff7e6'); bg.addColorStop(1, '#ffeccd');
  ctx.fillStyle = bg; ctx.fillRect(-20, -20, W + 40, H + 40);
  // 货架横线：虚线，避免和实线的警戒线抢视觉重量
  ctx.save();
  ctx.setLineDash([9, 13]);
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(214,154,85,.42)';
  for (let y = DEAD_Y + 130; y < H; y += 130) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.restore();
  // 柜底
  const floor = ctx.createLinearGradient(0, H - 7, 0, H);
  floor.addColorStop(0, 'rgba(214,154,85,.45)'); floor.addColorStop(1, 'rgba(190,130,70,.75)');
  ctx.fillStyle = floor; ctx.fillRect(0, H - 7, W, 7);

  // 警戒线：实线，越线时变红闪烁
  ctx.save();
  ctx.lineWidth = dangerT > 0 ? 2.5 : 1.6;
  ctx.setLineDash(dangerT > 0 ? [] : [0]);
  ctx.strokeStyle = dangerT > 0 ? `rgba(230,40,30,${.5 + .5 * Math.sin(time * 18)})` : 'rgba(198,120,60,.45)';
  ctx.beginPath(); ctx.moveTo(0, DEAD_Y); ctx.lineTo(W, DEAD_Y); ctx.stroke();
  if (dangerT <= 0) {
    ctx.font = `700 10px ${TEXT_FONT}`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = 'rgba(170,100,45,.5)';
    ctx.fillText('警戒', 6, DEAD_Y - 6);
  }
  ctx.restore();

  // 瞄准线 + 手上的奶盒
  if (!over) {
    const x = clampAim(curLv), y = spawnY(curLv);
    ctx.save();
    ctx.setLineDash([4, 8]); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(150,100,50,.25)';
    ctx.beginPath(); ctx.moveTo(x, y + LEVELS[curLv].h / 2); ctx.lineTo(x, H); ctx.stroke();
    ctx.restore();
    drawCarton(ctx, curLv, x, y, 1, 0, dropCd > 0 ? .45 : 1);
  }

  if (boom) {                                  // 光芒 + 中心辉光：两张预渲染贴图，逐帧只做旋转/缩放
    const a = Math.min(1, boom.t * 6) * Math.max(0, 1 - boom.t / 2.4);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = a;
    ctx.translate(boom.x, boom.y);
    ctx.rotate(boom.t * .9);
    const s = Math.hypot(W, H) / 256;          // 贴图半径 256 → 覆盖到画面对角
    ctx.drawImage(makeBurstSheet(), -256 * s, -256 * s, 512 * s, 512 * s);
    ctx.restore();
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = a;
    ctx.drawImage(makeGlowSheet(), boom.x - 210, boom.y - 210, 420, 420);
    ctx.restore();
  }

  for (const b of cartons()) drawCarton(ctx, b.lv, b.position.x, b.position.y, b.k, b.angle);

  // 彩蛋提示（解锁后才有内容，未解锁时是空操作）
  if (window.__hintDraw) window.__hintDraw(ctx);

  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
    if (p.conf) {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.scale(1, Math.cos(p.rot * 1.7));       // 翻转感
      ctx.fillStyle = p.color; ctx.fillRect(-p.r, -p.r * .5, p.r * 2, p.r);
      ctx.restore();
    } else if (p.spark) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = p.color; ctx.lineWidth = p.r; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(p.tr[0], p.tr[1]);
      for (let i = 2; i < p.tr.length; i += 2) ctx.lineTo(p.tr[i], p.tr[i + 1]);
      ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 1.2, 0, PI2); ctx.fill();
      ctx.restore();
    } else {
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, PI2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  ctx.save();                                    // 冲击波环
  ctx.globalCompositeOperation = 'lighter';
  for (const r of rings) {
    if (r.delay > 0) continue;
    ctx.globalAlpha = Math.max(0, r.life);
    ctx.lineWidth = r.w * r.life + 1;
    ctx.strokeStyle = '#ffe08a';
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, PI2); ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = 1;

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of popups) {
    if (p.mega || p.sub) {                       // 大爆炸标题：弹入 + 金色渐变 + 辉光
      const age = (p.mega ? 2.8 : 2.4) - p.life;
      const e = Math.min(1, Math.max(0, (age - (p.sub ? .25 : 0)) / .35));
      const sc = e < 1 ? 1.3 - .3 * e + Math.sin(e * Math.PI) * .18 : 1 + Math.sin(age * 6) * .025;
      ctx.save();
      ctx.globalAlpha = Math.min(1, p.life * 1.5) * Math.min(1, e * 2);
      ctx.translate(p.x, p.y); ctx.scale(sc, sc);
      if (p.mega) {
        // 标题（含金色渐变 + 双层描边）预渲染成一张贴图，逐帧只做缩放贴图
        const sheet = makeTitleSheet();
        ctx.drawImage(sheet, -360 / 2, -140 / 2, 360, 140);
      } else {
        ctx.font = `900 24px ${TEXT_FONT}`;
        ctx.lineWidth = 5; ctx.strokeStyle = '#7a2a05'; ctx.strokeText(p.text, 0, 0);
        ctx.fillStyle = '#ffd34d'; ctx.fillText(p.text, 0, 0);
      }
      ctx.restore();
      continue;
    }
    // 爆炸期间不画普通飘字，避免 +1000 和中心辉光糊在一起（分数已合进副标题）
    if (boom) continue;
    ctx.globalAlpha = Math.min(1, p.life * 2);
    ctx.font = `900 ${p.big ? 26 : 18}px ${TEXT_FONT}`;
    ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = p.big ? '#c2410c' : '#e8553a'; ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;

  if (flash > 0) {
    ctx.fillStyle = `rgba(255,248,215,${Math.min(1, flash) * .38})`;
    ctx.fillRect(-30, -30, W + 60, H + 60);
  }

  // 爆炸把场上清空时，别把"移动瞄准…"那行教学文案顶在庆祝动画中间
  // （用 mega 标题的生命周期判断，比 boom 的 2.6 秒更贴合实际观感）
  if (!cartons().length && !over && !boom && !popups.some((p) => p.mega)) {
    ctx.font = `700 16px ${TEXT_FONT}`;
    ctx.fillStyle = 'rgba(90,61,30,.55)';
    ctx.fillText('移动瞄准，点击 / 松手投放', W / 2, H * .5);
    ctx.fillText('两盒一样的撞在一起，合成更大的奶', W / 2, H * .5 + 26);
  }
}

function drawNext() {
  // 固定 40×52（与 CSS 中 .next canvas 一致），避免读父元素尺寸造成抖动
  const cssW = 40, cssH = 52;
  const cw = cssW * dpr, ch = cssH * dpr;
  nextCvs.width = cw; nextCvs.height = ch;
  nctx.setTransform(1, 0, 0, 1, 0, 0);
  nctx.clearRect(0, 0, cw, ch);
  // 按当前这一级自身尺寸填满框高：H5 原来按最大可投放级统一缩放，小盒子会小到看不清
  const L = LEVELS[nextLv];
  const k = Math.min((cw - 6) / L.w, (ch - 4) / L.h);
  drawCarton(nctx, nextLv, cw / 2, ch / 2, k);
}

// 合成表：十一盒按真实比例并排，底边对齐
const GAP = 3;
const SUM_W = LEVELS.reduce((t, L) => t + L.w, 0);
function chainScale(cssW) { return (cssW - GAP * (LEVELS.length - 1) - 6) / SUM_W; }
function drawChain() {
  const cssW = board.clientWidth;
  const k = chainScale(cssW);
  const cssH = Math.ceil(LEVELS[LAST].h * k) + 8;
  chainCvs.style.width = cssW + 'px';
  chainCvs.style.height = cssH + 'px';
  chainCvs.width = cssW * dpr; chainCvs.height = cssH * dpr;
  cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  let x = 3;
  LEVELS.forEach((L, i) => {
    drawCarton(cctx, i, x + L.w * k / 2, cssH - 4 - L.h * k / 2, k, 0, i <= maxLv ? 1 : .35);
    x += L.w * k + GAP;
  });
}

function updateHud() {
  $('score').textContent = score;
  $('best').textContent = best;
}

// ===== 尺寸自适应 =====
function layout() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  const headH = top_.offsetHeight + 8;
  // 棋盘高 = 宽·H/W，合成表高 ≈ 宽·chainRatio，一起塞进剩余高度
  const chainRatio = LEVELS[LAST].h * chainScale(1000) / 1000;
  const availH = innerHeight - headH - 40;
  const cssW = Math.floor(Math.max(240, Math.min(innerWidth - 16, availH / (H / W + chainRatio), 480)));
  const cssH = Math.round(cssW * H / W);
  board.style.width = cssW + 'px'; board.style.height = cssH + 'px';
  top_.style.width = cssW + 'px';
  cvs.width = cssW * dpr; cvs.height = cssH * dpr;
  viewScale = cssW / W;
  drawNext(); drawChain();
}

// ===== 输入 =====
function toLogicalX(e) {
  const rect = cvs.getBoundingClientRect();
  return (e.clientX - rect.left) / rect.width * W;
}
cvs.addEventListener('pointerdown', (e) => {
  cvs.setPointerCapture(e.pointerId);
  aimX = toLogicalX(e);
});
cvs.addEventListener('pointermove', (e) => { aimX = toLogicalX(e); });
cvs.addEventListener('pointerup', (e) => { aimX = toLogicalX(e); drop(); });

window.addEventListener('keydown', (e) => {
  // 切难度确认框开着时，只允许 Esc 关闭，避免空格在弹窗后面偷偷投盒
  if (!$('modeAsk').hidden) {
    if (e.key === 'Escape') $('modeAsk').hidden = true;
    return;
  }
  if (e.target.tagName === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
  if (e.key === 'ArrowLeft') aimX = Math.max(0, clampAim(curLv) - 12);
  else if (e.key === 'ArrowRight') aimX = Math.min(W, clampAim(curLv) + 12);
  else if (e.key === ' ') { e.preventDefault(); drop(); }
  else if (e.key === 'r' || e.key === 'R') reset();
});

$('resetBtn').addEventListener('click', reset);
$('restartBtn').addEventListener('click', reset);

// ===== 难度切换（改棋盘高度必须重开一局，否则墙体和画布坐标都会错位） =====
const modeBtn = $('modeBtn');
let pendingMode = mode;
function syncMode() {
  modeBtn.textContent = MODES[mode].name;
  modeBtn.setAttribute('aria-label', `难度：${MODES[mode].name}，点击切换`);
  // 用底色区分难度，扫一眼就知道当前是哪个，不用去读字
  modeBtn.style.background = mode === 'easy' ? '#dcfce7' : '#fff7e0';
  modeBtn.style.color = mode === 'easy' ? '#15803d' : '#8a5a2b';
}
function applyMode(next) {
  mode = next;
  localStorage.setItem(MODE_KEY, mode);
  H = MODES[mode].h;
  walls = buildWalls();   // 新旧高度差多少，墙就重建成多少
  best = loadBest();      // 切难度同时切最高分
  syncMode();
  layout();               // 画布尺寸按新高度重算
  reset();                // 清空世界并重新开一局
  // 切换后给个明确反馈，避免"看着像没生效"
  popups.push({ x: W / 2, y: H * .42, text: `已切到${MODES[mode].name}`, life: 1.8, big: true });
  popups.push({ x: W / 2, y: H * .42 + 34, text: `有效堆叠 ${H - DEAD_Y}`, life: 1.8 });
  tone(520, .12, 'sine', .18, .06);
}
modeBtn.addEventListener('click', () => {
  pendingMode = mode === 'hard' ? 'easy' : 'hard';
  $('modeAskTitle').textContent = `切到「${MODES[pendingMode].name}」？`;
  $('modeAsk').hidden = false;
});
$('modeOk').addEventListener('click', () => { $('modeAsk').hidden = true; applyMode(pendingMode); });
$('modeCancel').addEventListener('click', () => { $('modeAsk').hidden = true; });
const soundBtn = $('soundBtn');
function syncSound() {
  soundBtn.classList.toggle('muted', !soundOn);
  soundBtn.setAttribute('aria-pressed', String(soundOn));
}
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  localStorage.setItem('wildDogMilkSound', soundOn ? '1' : '0');
  syncSound();
});
window.addEventListener('resize', layout);

// ===== 主循环（固定步长，高刷屏也一样快） =====
function loop(t) {
  const dt = Math.min(100, t - (lastT || t));
  lastT = t;
  acc += slow > 0 ? dt * (.2 + .8 * (1 - Math.min(1, slow / .9))) : dt;
  let n = 0;
  while (acc >= STEP && n++ < 6) { update(STEP / 1000); acc -= STEP; }
  if (n >= 6) acc = 0;
  render();
  requestAnimationFrame(loop);
}

syncSound();
syncMode();
layout();
reset();
requestAnimationFrame(loop);
</script>
