<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: linear-gradient(#fff8ec, #ffdca8);
    color: #5a3d1e;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 8px 0 calc(6px + env(safe-area-inset-bottom));
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 2px 8px; }
  .title { font-size: 20px; font-weight: 900; letter-spacing: 1px; color: #c2410c; text-shadow: 0 2px 0 #fff; }
  .score { font-size: 30px; font-weight: 900; line-height: 1.1; }
  .best { font-size: 12px; opacity: .75; }
  .right { display: flex; align-items: center; gap: 8px; }
  .next { display: flex; flex-direction: column; align-items: center; font-size: 11px; background: #fff7; border-radius: 12px; padding: 4px 8px; }
  .next canvas { width: 44px; height: 60px; }
  .btns { display: flex; flex-direction: column; gap: 6px; }
  .icon-btn {
    width: 36px; height: 36px; border: 0; border-radius: 10px; cursor: pointer;
    background: #fff; color: #5a3d1e; font-size: 18px; box-shadow: 0 2px 0 #e5b679;
  }
  .icon-btn:focus-visible, .btn:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
  #board {
    position: relative; border-radius: 16px; overflow: hidden;
    box-shadow: 0 6px 0 #d69a55, 0 10px 24px #0002; background: #fffdf6;
  }
  #game { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; }
  #chain { display: block; margin-top: 10px; }
  .overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #0006; backdrop-filter: blur(2px);
  }
  .overlay[hidden] { display: none; }
  .dialog { background: #fff8ec; border-radius: 18px; padding: 22px 26px; text-align: center; min-width: 230px; box-shadow: 0 8px 30px #0004; }
  .dialog .emoji { font-size: 46px; }
  .dialog h2 { margin: 6px 0 10px; font-size: 22px; }
  .dialog p { margin: 4px 0; }
  .dialog strong { font-size: 26px; color: #c2410c; }
  .btn {
    margin-top: 14px; border: 0; border-radius: 12px; padding: 10px 26px; cursor: pointer;
    font: inherit; font-size: 17px; font-weight: 700; color: #fff; background: #e8553a; box-shadow: 0 3px 0 #a8321d;
  }
  .dialog .row { display: flex; gap: 8px; justify-content: center; margin-top: 14px; }
  .dialog .row .btn { margin-top: 0; }
  .btn.ghost { background: #fff; color: #8a5a2b; box-shadow: 0 3px 0 #e5b679; }
  .dialog .hint { font-size: 12px; opacity: .7; }
  /* 难度切换：贴在「最高 xx」后面，做成小圆角标签，不额外占头部高度 */
  .mode-chip {
    margin-left: 6px; padding: 1px 7px; border: 0; border-radius: 9px; cursor: pointer;
    font: inherit; font-size: 11px; font-weight: 700; color: #8a5a2b; vertical-align: 1px;
    background: #fff; box-shadow: 0 1px 0 #e5b679;
  }
  .mode-chip:active { transform: translateY(1px); }
</style>

<body>

<header id="top">
  <div>
    <div class="title">合成野生狗奶</div>
    <div class="score" id="score" aria-live="polite">0</div>
    <div class="best">最高 <span id="best">0</span><button class="mode-chip" id="modeBtn" type="button" aria-label="难度：困难，点击切换">困难</button></div>
  </div>
  <div class="right">
    <div class="next"><span>下一个</span><canvas id="next" aria-label="下一个奶盒"></canvas></div>
    <div class="btns">
      <button class="icon-btn" id="soundBtn" type="button" aria-label="音效开关" aria-pressed="true">🔊</button>
      <button class="icon-btn" id="resetBtn" type="button" aria-label="重新开始">↻</button>
    </div>
  </div>
</header>

<div id="board">
  <canvas id="game" aria-label="游戏区域：移动瞄准，点击或松手投放"></canvas>
  <div class="overlay" id="over" hidden>
    <div class="dialog" role="dialog" aria-labelledby="overTitle">
      <div class="emoji">🐕</div>
      <h2 id="overTitle">奶溢出来了</h2>
      <p>本局得分 <strong id="finalScore">0</strong></p>
      <p>最高分 <span id="finalBest">0</span></p>
      <p>本局最高合成：<span id="finalLevel">-</span></p>
      <button class="btn" id="restartBtn" type="button">再来一局</button>
    </div>
  </div>
  <div class="overlay" id="modeAsk" hidden>
    <div class="dialog" role="dialog" aria-labelledby="modeAskTitle">
      <div class="emoji">🎚️</div>
      <h2 id="modeAskTitle">切到「简单」？</h2>
      <p>切换难度需要重开本局</p>
      <p class="hint">当前这局的分数不会保留</p>
      <div class="row">
        <button class="btn ghost" id="modeCancel" type="button">再想想</button>
        <button class="btn" id="modeOk" type="button">切换</button>
      </div>
    </div>
  </div>

<canvas id="chain" aria-label="合成顺序：从野生马尿到野生狗奶"></canvas>

<!-- Matter.js 0.20.0（MIT），本地引入，负责奶盒的刚体碰撞和翻倒 -->
<script src="lib/matter.min.js"></script>
<script>
'use strict';

// ===== 十一级奶盒 =====
// s：面积开方（决定体积），相邻两级线性尺寸约差 12%~24%，保证每一级都能一眼看出大小
// aspect：贴图宽高比（img/N.png 的实际裁切比例），宽 = s·√aspect，高 = s/√aspect
const LEVELS = [
  { name: '野生马尿',         color: '#f2c230', s: 42,  aspect: .468 },
  { name: '野生狗尿',         color: '#5fa83c', s: 51,  aspect: .436 },
  { name: '野生鼠奶',         color: '#4a4f58', s: 62,  aspect: .433 },
  { name: '野生驴奶',         color: '#2e7fc9', s: 75,  aspect: .436 },
  { name: '老母鸡奶',         color: '#8a5a2b', s: 90,  aspect: .451 },
  { name: '野生见手青奶',     color: '#2f6a3d', s: 104, aspect: .440 },
  { name: '野老猫猴奶',       color: '#2b2b33', s: 120, aspect: .427 },
  { name: '野生爱因斯坦奶',   color: '#5b3a91', s: 136, aspect: .423 },
  { name: '幻纹虎奶',         color: '#d9531e', s: 154, aspect: .431 },
  { name: '野生龙奶',         color: '#e07a1f', s: 171, aspect: .435 },
  { name: '野生奶·终极进化版', color: '#1f4fa8', s: 211, aspect: .736 },
];
LEVELS.forEach((L) => {
  L.w = L.s * Math.sqrt(L.aspect);
  L.h = L.s / Math.sqrt(L.aspect);
  L.round = Math.max(3, L.w * .1);
});
const LAST = LEVELS.length - 1;
const SPAWN_WEIGHTS = [30, 28, 22, 13, 7];             // 只投放前 5 级，越小越常见
const MERGE_SCORE = LEVELS.map((_, i) => i * (i + 1)); // 合成出第 i 级得分
const FINAL_BONUS = 1000;                              // 两盒终极狗奶相撞：一起炸掉

// ===== 世界参数（逻辑坐标） =====
// 只有棋盘高度随难度变化，警戒线固定 150：
//   困难 720 → 有效堆叠 570（原版手感）
//   简单 750 → 有效堆叠 600
// 警戒线要高过最大的可投放奶盒（第 5 级，高 134），不然手上那盒会被画到棋盘外
const MODES = { hard: { name: '困难', h: 720 }, easy: { name: '简单', h: 750 } };
const MODE_KEY = 'wildDogMilkMode';
let mode = localStorage.getItem(MODE_KEY) === 'easy' ? 'easy' : 'hard';
const W = 400;
let H = MODES[mode].h;
const DEAD_Y = 150;
const STEP = 1000 / 60;
const PI2 = Math.PI * 2;
const TEXT_FONT = '"PingFang SC","Microsoft YaHei",sans-serif';

const { Engine, Bodies, Body, Composite, Events } = Matter;
const $ = (id) => document.getElementById(id);
const cvs = $('game'), ctx = cvs.getContext('2d');
const nextCvs = $('next'), nctx = nextCvs.getContext('2d');
const chainCvs = $('chain'), cctx = chainCvs.getContext('2d');
const board = $('board'), top_ = $('top');

const engine = Engine.create({ positionIterations: 10, velocityIterations: 8 });
engine.gravity.y = 1.6;
const world = engine.world;

let viewScale = 1, dpr = 1;
let particles = [], popups = [], mergeQueue = [];
// 最高分按难度分别记录：简单模式更容易出高分，混在一起会污染困难模式的记录
function bestKey() { return 'wildDogMilkBest_' + mode; }
function loadBest() { return +localStorage.getItem(bestKey()) || 0; }

// 老版本只有一条最高分，且那时候只有困难模式（H=720），升级时迁移一次就删掉旧 key
(function migrateLegacyBest() {
  const legacy = +localStorage.getItem('wildDogMilkBest') || 0;
  if (legacy > 0 && localStorage.getItem('wildDogMilkBest_hard') === null) {
    localStorage.setItem('wildDogMilkBest_hard', legacy);
  }
  localStorage.removeItem('wildDogMilkBest');
})();

let score = 0, best = loadBest();
let curLv = 0, nextLv = 0, aimX = W / 2, dropCd = 0;
let dangerT = 0, maxLv = 0, shake = 0, over = false, acc = 0, lastT = 0, time = 0;
let soundOn = localStorage.getItem('wildDogMilkSound') !== '0';

// 墙体放在可视区外，足够厚防止穿透；换难度时连同高度一起重建
const WALL = 200;
function buildWalls() {
  return [
    Bodies.rectangle(W / 2, H + WALL / 2, W + WALL * 2, WALL, { isStatic: true, friction: .6 }),
    Bodies.rectangle(-WALL / 2, H / 2 - 400, WALL, H + 800, { isStatic: true, friction: .1 }),
    Bodies.rectangle(W + WALL / 2, H / 2 - 400, WALL, H + 800, { isStatic: true, friction: .1 }),
  ];
}
let walls = buildWalls();

// ===== 贴图 =====
LEVELS.forEach((L) => {
  const img = new Image();
  img.onload = () => { L.img = img; drawNext(); drawChain(); };
  img.src = `img/${LEVELS.indexOf(L) + 1}.png`;
});

function roundRect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

// 在 (x,y) 以角度 angle 画一盒第 i 级奶，k 为缩放
function drawCarton(g, i, x, y, k = 1, angle = 0, alpha = 1) {
  const L = LEVELS[i], w = L.w * k, h = L.h * k, r = L.round * k;
  g.save();
  g.globalAlpha = alpha;
  g.translate(x, y); g.rotate(angle);
  // 阴影
  g.fillStyle = 'rgba(80,45,10,.22)';
  roundRect(g, -w / 2 + 1.5 * k, -h / 2 + 2.5 * k, w, h, r); g.fill();
  if (L.img) {
    g.save();
    roundRect(g, -w / 2, -h / 2, w, h, r); g.clip();
    g.drawImage(L.img, -w / 2, -h / 2, w, h);
    g.restore();
  } else {
    // 图片缺失时的兜底：纯色盒子 + 名字
    g.fillStyle = L.color;
    roundRect(g, -w / 2, -h / 2, w, h, r); g.fill();
    g.fillStyle = '#fff';
    g.font = `900 ${Math.min(w * .22, h / L.name.length)}px ${TEXT_FONT}`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    [...L.name].forEach((ch, n, arr) => g.fillText(ch, 0, (n - (arr.length - 1) / 2) * h / (arr.length + 1)));
  }
  roundRect(g, -w / 2, -h / 2, w, h, r);
  g.lineWidth = Math.max(1, w * .025);
  g.strokeStyle = 'rgba(60,35,10,.45)'; g.stroke();
  if (i === LAST) {
    g.lineWidth = w * .03; g.strokeStyle = '#ffd34d';
    roundRect(g, -w / 2 - g.lineWidth / 2, -h / 2 - g.lineWidth / 2, w + g.lineWidth, h + g.lineWidth, r); g.stroke();
  }
  g.restore();
}

// ===== 音效 =====
let actx = null;
function tone(freq, dur = .12, type = 'sine', vol = .2, delay = 0) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + delay;
    const o = actx.createOscillator(), gn = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(freq * .55, t + dur);
    gn.gain.setValueAtTime(vol, t);
    gn.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(gn).connect(actx.destination);
    o.start(t); o.stop(t + dur + .02);
  } catch (_) { /* 音频不可用时静默 */ }
}

// ===== 游戏逻辑 =====
function randLv() {
  const cap = Math.min(SPAWN_WEIGHTS.length, Math.max(3, maxLv));
  let total = 0;
  for (let i = 0; i < cap; i++) total += SPAWN_WEIGHTS[i];
  let r = Math.random() * total;
  for (let i = 0; i < cap; i++) { r -= SPAWN_WEIGHTS[i]; if (r < 0) return i; }
  return 0;
}

function cartons() { return Composite.allBodies(world).filter((b) => b.lv !== undefined); }

function spawnY(lv) { return DEAD_Y - 6 - LEVELS[lv].h / 2; }

function makeCarton(lv, x, y, angle = 0, k = 1) {
  const L = LEVELS[lv];
  const b = Bodies.rectangle(x, y, L.w * k, L.h * k, {
    angle, chamfer: { radius: L.round * k },
    friction: .25, frictionStatic: .5, frictionAir: .004, restitution: .12, density: .0012,
  });
  b.lv = lv; b.k = k; b.born = time; b.gone = false;
  Composite.add(world, b);
  return b;
}

function reset() {
  Composite.clear(world, false);
  Composite.add(world, walls);
  particles = []; popups = []; mergeQueue = [];
  score = 0; maxLv = 0; dangerT = 0; dropCd = 0; shake = 0; over = false;
  curLv = randLv(); nextLv = randLv();
  aimX = W / 2;
  $('over').hidden = true;
  $('modeAsk').hidden = true;
  updateHud(); drawNext(); drawChain();
}

function clampAim(lv) {
  const half = LEVELS[lv].w / 2 + 1;
  return Math.min(W - half, Math.max(half, aimX));
}

function drop() {
  if (over || dropCd > 0) return;
  const b = makeCarton(curLv, clampAim(curLv), spawnY(curLv));
  Body.setVelocity(b, { x: 0, y: 2 });
  tone(320, .08, 'triangle', .12);
  curLv = nextLv; nextLv = randLv();
  dropCd = .5;
  drawNext();
}

function addScore(n, x, y) {
  score += n;
  popups.push({ x, y, text: '+' + n, life: 1 });
  if (score > best) { best = score; localStorage.setItem(bestKey(), best); }
  updateHud();
}

function burst(x, y, color, n, speed) {
  for (let k = 0; k < n; k++) {
    const a = Math.random() * PI2, v = speed * (.4 + Math.random() * .6);
    particles.push({
      x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - speed * .3,
      r: 2 + Math.random() * 3.5, life: 1, decay: 1.2 + Math.random(),
      color: Math.random() < .6 ? '#fffdf5' : color,
    });
  }
}

// 同级相碰：先记进队列，物理步结束后统一处理（避免在碰撞回调里改世界）
function onCollide(e) {
  if (over) return;
  for (const { bodyA: a, bodyB: b } of e.pairs) {
    if (a.lv === undefined || a.lv !== b.lv || a.gone || b.gone) continue;
    a.gone = b.gone = true;
    mergeQueue.push([a, b]);
  }
}
Events.on(engine, 'collisionStart', onCollide);
Events.on(engine, 'collisionActive', onCollide);

function merge(a, b) {
  Composite.remove(world, [a, b]);
  const x = (a.position.x + b.position.x) / 2, y = (a.position.y + b.position.y) / 2;
  if (a.lv === LAST) {
    burst(x, y, '#ffd34d', 70, 520);
    shake = 14;
    addScore(FINAL_BONUS, x, y);
    popups.push({ x: W / 2, y: H * .38, text: '🐕 狗奶大爆炸', life: 1.6, big: true });
    tone(200, .5, 'sawtooth', .18); tone(500, .4, 'sine', .2, .1);
    return;
  }
  const lv = a.lv + 1, L = LEVELS[lv];
  // 新盒子从 0.5 倍长到原尺寸，避免一出生就把周围的盒子炸飞
  const nb = makeCarton(lv, x, y, (a.angle + b.angle) / 2, .5);
  Body.setVelocity(nb, { x: (a.velocity.x + b.velocity.x) / 2, y: Math.min(0, (a.velocity.y + b.velocity.y) / 2) - 1 });
  burst(x, y, L.color, 8 + lv * 2, 160 + lv * 25);
  addScore(MERGE_SCORE[lv], x, y - L.h / 2);
  if (lv > maxLv) {
    maxLv = lv; drawChain();
    if (lv >= 5) popups.push({ x: W / 2, y: H * .38, text: L.name, life: 1.6, big: true });
  }
  if (lv === LAST) { shake = 10; tone(520, .5, 'triangle', .2); tone(780, .5, 'triangle', .15, .15); }
  else { shake = Math.max(shake, lv * .5); tone(780 - lv * 50, .14, 'sine', .22); }
}

function update(dt) {
  time += dt;
  if (dropCd > 0) dropCd -= dt;

  if (!over) {
    Engine.update(engine, STEP);
    const q = mergeQueue; mergeQueue = [];
    q.forEach(([a, b]) => merge(a, b));
    for (const b of cartons()) {
      if (b.k < 1) {
        const k = Math.min(1, b.k + dt / .18);
        Body.scale(b, k / b.k, k / b.k);
        b.k = k;
      }
    }
  }

  for (const p of particles) {
    p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= p.decay * dt;
  }
  particles = particles.filter((p) => p.life > 0);
  for (const p of popups) { p.y -= 40 * dt; p.life -= dt; }
  popups = popups.filter((p) => p.life > 0);
  shake = Math.max(0, shake - 40 * dt);

  if (over) return;
  // 越线判定：已落定的奶盒顶在警戒线上方持续 2 秒
  const danger = cartons().some((b) => time - b.born > 1.2 && b.bounds.min.y < DEAD_Y && b.speed < 1.5);
  dangerT = danger ? dangerT + dt : Math.max(0, dangerT - dt * 2);
  if (dangerT > 2) gameOver();
}

function gameOver() {
  over = true;
  tone(300, .6, 'sawtooth', .15); tone(180, .7, 'sawtooth', .12, .2);
  $('finalScore').textContent = score;
  $('finalBest').textContent = best;
  $('finalLevel').textContent = `Lv.${maxLv + 1} ${LEVELS[maxLv].name}`;
  setTimeout(() => { $('over').hidden = false; $('restartBtn').focus(); }, 500);
}

// ===== 绘制 =====
function render() {
  ctx.setTransform(viewScale * dpr, 0, 0, viewScale * dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);

  // 背景：超市冷柜货架
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#fffaf0'); bg.addColorStop(1, '#ffe9c7');
  ctx.fillStyle = bg; ctx.fillRect(-20, -20, W + 40, H + 40);
  // 货架横线：虚线，避免和实线的警戒线抢视觉重量
  ctx.save();
  ctx.setLineDash([12, 10]);
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#f3d3a3';
  for (let y = DEAD_Y + 130; y < H; y += 130) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle = '#d69a55'; ctx.fillRect(0, H - 6, W, 6);

  // 警戒线：实线，越线时变红闪烁
  ctx.save();
  ctx.lineWidth = 2;
  ctx.strokeStyle = dangerT > 0 ? `rgba(230,40,30,${.5 + .5 * Math.sin(time * 18)})` : 'rgba(200,120,60,.35)';
  ctx.beginPath(); ctx.moveTo(0, DEAD_Y); ctx.lineTo(W, DEAD_Y); ctx.stroke();
  ctx.restore();

  // 瞄准线 + 手上的奶盒
  if (!over) {
    const x = clampAim(curLv), y = spawnY(curLv);
    ctx.save();
    ctx.setLineDash([4, 8]); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(150,100,50,.25)';
    ctx.beginPath(); ctx.moveTo(x, y + LEVELS[curLv].h / 2); ctx.lineTo(x, H); ctx.stroke();
    ctx.restore();
    drawCarton(ctx, curLv, x, y, 1, 0, dropCd > 0 ? .45 : 1);
  }

  for (const b of cartons()) drawCarton(ctx, b.lv, b.position.x, b.position.y, b.k, b.angle);

  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, PI2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of popups) {
    ctx.globalAlpha = Math.min(1, p.life * 2);
    ctx.font = `900 ${p.big ? 26 : 18}px ${TEXT_FONT}`;
    ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = p.big ? '#c2410c' : '#e8553a'; ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;

  if (!cartons().length && !over) {
    ctx.font = `700 16px ${TEXT_FONT}`;
    ctx.fillStyle = 'rgba(90,61,30,.55)';
    ctx.fillText('移动瞄准，点击 / 松手投放', W / 2, H * .5);
    ctx.fillText('两盒一样的撞在一起，合成更大的奶', W / 2, H * .5 + 26);
  }
}

function drawNext() {
  const cw = 44 * dpr, ch = 60 * dpr;
  nextCvs.width = cw; nextCvs.height = ch;
  nctx.setTransform(1, 0, 0, 1, 0, 0);
  nctx.clearRect(0, 0, cw, ch);
  // 按真实比例缩放（可投放的最大一级占满框）
  const big = LEVELS[SPAWN_WEIGHTS.length - 1];
  const k = Math.min((cw - 4) / big.w, (ch - 6) / big.h);
  drawCarton(nctx, nextLv, cw / 2, ch / 2, k);
}

// 合成表：十一盒按真实比例并排，底边对齐
const GAP = 3;
const SUM_W = LEVELS.reduce((t, L) => t + L.w, 0);
function chainScale(cssW) { return (cssW - GAP * (LEVELS.length - 1) - 6) / SUM_W; }
function drawChain() {
  const cssW = board.clientWidth;
  const k = chainScale(cssW);
  const cssH = Math.ceil(LEVELS[LAST].h * k) + 8;
  chainCvs.style.width = cssW + 'px';
  chainCvs.style.height = cssH + 'px';
  chainCvs.width = cssW * dpr; chainCvs.height = cssH * dpr;
  cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  let x = 3;
  LEVELS.forEach((L, i) => {
    drawCarton(cctx, i, x + L.w * k / 2, cssH - 4 - L.h * k / 2, k, 0, i <= maxLv ? 1 : .35);
    x += L.w * k + GAP;
  });
}

function updateHud() {
  $('score').textContent = score;
  $('best').textContent = best;
}

// ===== 尺寸自适应 =====
function layout() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  const headH = top_.offsetHeight + 8;
  // 棋盘高 = 宽·H/W，合成表高 ≈ 宽·chainRatio，一起塞进剩余高度
  const chainRatio = LEVELS[LAST].h * chainScale(1000) / 1000;
  const availH = innerHeight - headH - 40;
  const cssW = Math.floor(Math.max(240, Math.min(innerWidth - 16, availH / (H / W + chainRatio), 480)));
  const cssH = Math.round(cssW * H / W);
  board.style.width = cssW + 'px'; board.style.height = cssH + 'px';
  top_.style.width = cssW + 'px';
  cvs.width = cssW * dpr; cvs.height = cssH * dpr;
  viewScale = cssW / W;
  drawNext(); drawChain();
}

// ===== 输入 =====
function toLogicalX(e) {
  const rect = cvs.getBoundingClientRect();
  return (e.clientX - rect.left) / rect.width * W;
}
cvs.addEventListener('pointerdown', (e) => {
  cvs.setPointerCapture(e.pointerId);
  aimX = toLogicalX(e);
});
cvs.addEventListener('pointermove', (e) => { aimX = toLogicalX(e); });
cvs.addEventListener('pointerup', (e) => { aimX = toLogicalX(e); drop(); });

window.addEventListener('keydown', (e) => {
  // 切难度确认框开着时，只允许 Esc 关闭，避免空格在弹窗后面偷偷投盒
  if (!$('modeAsk').hidden) {
    if (e.key === 'Escape') $('modeAsk').hidden = true;
    return;
  }
  if (e.target.tagName === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
  if (e.key === 'ArrowLeft') aimX = Math.max(0, clampAim(curLv) - 12);
  else if (e.key === 'ArrowRight') aimX = Math.min(W, clampAim(curLv) + 12);
  else if (e.key === ' ') { e.preventDefault(); drop(); }
  else if (e.key === 'r' || e.key === 'R') reset();
});

$('resetBtn').addEventListener('click', reset);
$('restartBtn').addEventListener('click', reset);

// ===== 难度切换（改棋盘高度必须重开一局，否则墙体和画布坐标都会错位） =====
const modeBtn = $('modeBtn');
let pendingMode = mode;
function syncMode() {
  modeBtn.textContent = MODES[mode].name;
  modeBtn.setAttribute('aria-label', `难度：${MODES[mode].name}，点击切换`);
}
function applyMode(next) {
  mode = next;
  localStorage.setItem(MODE_KEY, mode);
  H = MODES[mode].h;
  walls = buildWalls();   // 新旧高度差多少，墙就重建成多少
  best = loadBest();      // 切难度同时切最高分
  syncMode();
  layout();               // 画布尺寸按新高度重算
  reset();                // 清空世界并重新开一局
  tone(520, .12, 'sine', .18, .06);
}
modeBtn.addEventListener('click', () => {
  pendingMode = mode === 'hard' ? 'easy' : 'hard';
  $('modeAskTitle').textContent = `切到「${MODES[pendingMode].name}」？`;
  $('modeAsk').hidden = false;
});
$('modeOk').addEventListener('click', () => { $('modeAsk').hidden = true; applyMode(pendingMode); });
$('modeCancel').addEventListener('click', () => { $('modeAsk').hidden = true; });
const soundBtn = $('soundBtn');
function syncSound() {
  soundBtn.textContent = soundOn ? '🔊' : '🔇';
  soundBtn.setAttribute('aria-pressed', String(soundOn));
}
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  localStorage.setItem('wildDogMilkSound', soundOn ? '1' : '0');
  syncSound();
});
window.addEventListener('resize', layout);

// ===== 主循环（固定步长，高刷屏也一样快） =====
function loop(t) {
  const dt = Math.min(100, t - (lastT || t));
  lastT = t;
  acc += dt;
  let n = 0;
  while (acc >= STEP && n++ < 6) { update(STEP / 1000); acc -= STEP; }
  if (n >= 6) acc = 0;
  render();
  requestAnimationFrame(loop);
}

syncSound();
syncMode();
layout();
reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
